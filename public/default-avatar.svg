<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822"/>
      <stop offset="100%" stop-color="#0B0D13"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.12)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>
    <linearGradient id="silhouette" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232B3A"/>
      <stop offset="100%" stop-color="#121620"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#glow)"/>

  <!-- Minimal Architectural Grid Pattern -->
  <line x1="40" y1="0" x2="40" y2="480" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="360" y1="0" x2="360" y2="480" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="80" x2="400" y2="80" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="400" x2="400" y2="400" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Stylized Elegant Portrait Silhouette -->
  <g opacity="0.85">
    <!-- Head -->
    <circle cx="200" cy="180" r="64" fill="url(#silhouette)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <!-- Shoulders / Torso -->
    <path d="M110 370 C110 270, 150 255, 200 255 C250 255, 290 270, 290 370 Z" fill="url(#silhouette)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <!-- Subtle Monogram -->
    <text x="200" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="#E2E8F0" letter-spacing="4">AP</text>
  </g>

  <!-- Clean Frame Details -->
  <text x="200" y="420" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748B" letter-spacing="2">ARYA PATLE • PORTFOLIO</text>
  <text x="200" y="438" text-anchor="middle" font-family="monospace" font-size="10" fill="#10B981" letter-spacing="1">CLICK TO UPLOAD YOUR PHOTO</text>
</svg>
